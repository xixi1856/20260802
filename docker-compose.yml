name: blindway
services:
  backend:
    profiles: [app]
    image: ${BACKEND_IMAGE:-blindway-backend:local}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blindway}
      DATABASE_USERNAME: ${POSTGRES_USER:-blindway}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-blindway}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-blindway}
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-blindway}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-blindway-change-me}
      MQTT_ENABLED: "true"
      MQTT_BROKER_URI: tcp://emqx:1883
      MQTT_BACKEND_USERNAME: ${MQTT_BACKEND_USERNAME:-blindway-backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-blindway-backend}
      MQTT_INGRESS_MODE: ${MQTT_INGRESS_MODE:-database}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092,kafka-2:19092,kafka-3:19092}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32-bytes}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      SPATIAL_MAX_CONCURRENT: ${SPATIAL_MAX_CONCURRENT:-5}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      emqx:
        condition: service_started

  gateway:
    profiles: [app]
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./ops/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blindway}
      POSTGRES_USER: ${POSTGRES_USER:-blindway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blindway}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-blindway}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-blindway}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-blindway}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-blindway-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  emqx:
    image: emqx/emqx:5.8.8
    environment:
      EMQX_NAME: blindway-emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-blindway-change-me}
      # Two ingress instances can absorb 2,000 concurrent Kafka sends. Keep a
      # finite 10k broker queue for short bursts and alert long before it fills.
      EMQX_MQTT__MAX_INFLIGHT: 128
      EMQX_MQTT__MAX_MQUEUE_LEN: 10000
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log

  kafka-1:
    profiles: [kafka]
    image: apache/kafka:4.3.0
    hostname: kafka-1
    restart: unless-stopped
    ports:
      - "29092:9092"
    environment: &kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Docker Desktop can briefly starve co-located JVMs during image rebuilds.
      # Relax KRaft quorum timers to avoid false controller elections while still
      # detecting a genuinely failed controller within tens of seconds.
      KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 10000
      KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS: 20000
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 10000
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck: &kafka-healthcheck
      # A JVM-based Kafka CLI can exceed the timeout on a busy Docker Desktop
      # host and creates false unhealthy states. The application readiness path
      # validates Kafka semantics; this probe only checks broker liveness.
      test: ["CMD-SHELL", "nc -z localhost 19092"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-2:
    profiles: [kafka]
    image: apache/kafka:4.3.0
    hostname: kafka-2
    restart: unless-stopped
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-3:
    profiles: [kafka]
    image: apache/kafka:4.3.0
    hostname: kafka-3
    restart: unless-stopped
    ports:
      - "49092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-blindway-change-me}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./ops/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.5.3
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./ops/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

volumes:
  postgres-data:
  minio-data:
  emqx-data:
  emqx-log:
  grafana-data:
  loki-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
